<title id="t">HYDRA-UMC-DEV-SERVER architecture</title>
<desc id="d">HYDRA-UMC-DEV-SERVER runs one allow-listed command in an isolated workspace with a scrubbed environment, keeps tasks in a durable SQLite queue and chains a gated repair cycle that coordinates with the ops agent.</desc>
