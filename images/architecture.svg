<text x="36" y="70" font-family="'Segoe UI','Noto Sans','Noto Sans CJK SC','Microsoft YaHei','Yu Gothic','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8B949E" text-anchor="start">A bounded runner, a durable queue and a gated repair cycle, with nothing deployed.</text>
<text x="36" y="104" font-family="'Segoe UI','Noto Sans','Noto Sans CJK SC','Microsoft YaHei','Yu Gothic','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#8B949E" text-anchor="start" letter-spacing="2">WHO USES IT</text>
